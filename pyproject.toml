[project]
name = "giga-china-crawler"
version = "0.1.0"
description = "Serwer MCP i dashboard: chińscy dostawcy z najniższą ceną i MOQ"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2,<3",
    "scrapling[fetchers]>=0.4.15,<0.5",
    "google-genai>=3.2",
    "openai>=2",
    "httpx>=0.28",
    "lxml>=6",
    "python-dotenv>=1",
    "onnxruntime>=1.32.0",
    "opencv-python-headless>=5.1.0.95",
    "pillow>=13.0.0",
    "pycryptodome>=4.6.0",
]

[project.scripts]
giga-china-crawler = "giga_china_crawler.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
